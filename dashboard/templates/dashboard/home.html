<!DOCTYPE html>
<html>
<head>
    <title>CloudWise Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .card {
            background: white;
            width: 230px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CloudWise Dashboard</h1>

    <div class="container">

        <div class="card">
            <h2>Total Cost</h2>
            <div class="value">₹43,500</div>
        </div>

        <div class="card">
            <h2>Potential Saving</h2>
            <div class="value">₹23,000</div>
        </div>

        <div class="card">
            <h2>Optimized Cost</h2>
            <div class="value">₹20,500</div>
        </div>

        <div class="card">
            <h2>Saving %</h2>
            <div class="value">52.87%</div>
        </div>

    </div>

</body>
</html>
